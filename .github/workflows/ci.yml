name: CI
on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
    test:
        name: Node ${{ matrix.node }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                node: [22, 24]
        services:
            redis:
                image: redis:8-alpine
                ports: [6379:6379]
                options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
        env:
            TEST_REDIS_URL: redis://127.0.0.1:6379
            GALLERY_DL_AUTO_INSTALL: "false"
            YOUTUBE_DL_SKIP_DOWNLOAD: "true"
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run check
            - run: pnpm run test:redis
            - run: pnpm audit --prod --audit-level high
    version:
        name: Release metadata
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version: 24
            - run: node scripts/release.mjs validate

    container:
        name: Container build
        needs: test
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  persist-credentials: false
            - run: docker build --check .
            - run: docker build --tag mediafilez-worker:ci .

    publish:
        name: Publish immutable image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        needs: [test, container, version]
        runs-on: ubuntu-latest
        timeout-minutes: 25
        permissions:
            contents: read
            packages: write
        outputs:
            digest: ${{ steps.image.outputs.digest }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version: 24
            - id: version
              run: node scripts/release.mjs validate
            - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
            - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
              id: image
              with:
                  context: .
                  file: Dockerfile
                  push: true
                  tags: ghcr.io/mediafilez/media-worker:sha-${{ github.sha }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ steps.version.outputs.version }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy:
        name: Deploy and verify health
        needs: publish
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            packages: read
            id-token: write
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version: 24
            - run: node scripts/deploy-client.mjs
              env:
                  DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
                  DEPLOY_ROLE: worker
                  IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    release:
        name: Publish verified release
        needs: [publish, deploy]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
            packages: write
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version: 24
            - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
            - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - run: node scripts/release.mjs publish
              env:
                  IMAGE_REPOSITORY: ghcr.io/mediafilez/media-worker
                  IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
